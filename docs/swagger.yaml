    - CityIsfahan
    - CityMashhad
    - CityShiraz
    - CityTabriz
    - CityKaraj
    - CityQom
    - CityAhvaz
    - CityRasht
    - CityYazd
  enums.EmployerReviewStatus:
    enum:
