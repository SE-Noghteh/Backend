      tags:
      - Legal employers
  /legal-employers/otp:
    post:
      consumes:
      - application/json
      description: Requires a complete pending signup submitted within the last 30
        minutes. Signup sends the first code automatically. Resends a real SMS after
        a 60-second cooldown; the code expires in 5 minutes.
      parameters:
      - description: Phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/general.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Resend legal employer verification OTP
      tags:
      - Legal employers
  /legal-employers/signup:
    post:
      consumes:
      - multipart/form-data
      description: 'Validates and saves the complete multipart submission and private
        files, then sends OTP automatically. Returns 202; no employer account exists
        until verify-otp succeeds. Pending signup lasts 30 minutes. Email and website
        are optional. Select activities from signup-options. Activity license is required
        when requires_activity_license is true. An attorney must upload authorization_document.
        Company identifier format is checked; official company and representative
        authority verification remains pending review. Password requires 12-72 bytes
        with uppercase, lowercase, number, symbol. Documents: PDF/PNG/JPEG up to 5
        MiB each. Video: MP4/MOV, 1-20 seconds, up to 50 MiB. Requires configured
        S3 and ffprobe.'
      parameters:
      - description: Registered company or organization name
        in: formData
        name: company_name
        required: true
        type: string
      - description: Legal entity type
        enum:
        - limited_liability
        - private_joint_stock
        - public_joint_stock
        - cooperative
        - institution
        - organization
        in: formData
        name: legal_entity_type
        required: true
        type: string
      - description: Eleven-digit company national identifier
        in: formData
        name: company_national_id
        required: true
        type: string
      - description: Registration number (1-30 digits)
        in: formData
        name: registration_number
        required: true
        type: string
      - description: Twelve-digit economic code
        in: formData
        name: economic_code
        required: true
        type: string
      - description: Province from signup-options
        in: formData
        name: province
        required: true
        type: string
      - description: City belonging to selected province
        in: formData
        name: city
        required: true
        type: string
      - description: Registered office address
        in: formData
        name: address
        required: true
        type: string
      - description: Ten-digit postal code
        in: formData
        name: postal_code
        required: true
        type: string
      - description: Representative first name
        in: formData
        name: representative_first_name
        required: true
        type: string
      - description: Representative last name
        in: formData
        name: representative_last_name
        required: true
        type: string
      - description: Representative authority; attorney requires authorization_document
        enum:
        - ceo
        - authorized_signatory
        - attorney
        in: formData
        name: representative_position
        required: true
        type: string
      - description: Representative gender
        enum:
        - female
        - male
        in: formData
        name: representative_gender
        required: true
        type: string
      - description: Representative ten-digit national code with valid checksum
        in: formData
        name: representative_national_code
        required: true
        type: string
      - default: false
        description: Organization has a tax file
        in: formData
        name: has_tax_file
        type: boolean
      - collectionFormat: multi
        description: Select 1-10 distinct activity areas from signup-options; repeat
          this form key for each choice
        in: formData
        items:
          type: string
        name: activities
        required: true
        type: array
      - description: HTTP or HTTPS website/social page URL
        in: formData
        name: website
        type: string
      - default: false
        description: Whether the organization's activity requires a license; requires
          activity_license when true
        in: formData
        name: requires_activity_license
        type: boolean
      - description: Representative phone to receive verification OTP
        in: formData
        name: phone
        required: true
        type: string
      - description: Email address
        in: formData
        name: email
        type: string
      - description: 'Password: 12-72 bytes, uppercase, lowercase, digit and symbol'
        in: formData
        name: password
        required: true
        type: string
      - description: Establishment notice or official gazette (PDF/PNG/JPEG, <=5 MiB)
        in: formData
        name: establishment_document
        required: true
        type: file
      - description: Representative first page of identity document (PDF/PNG/JPEG,
          <=5 MiB)
        in: formData
        name: identity_document
        required: true
        type: file
      - description: License; required when requires_activity_license=true (PDF/PNG/JPEG,
          <=5 MiB)
        in: formData
        name: activity_license
        type: file
      - description: Power of attorney; required for attorney position (PDF/PNG/JPEG,
          <=5 MiB)
        in: formData
        name: authorization_document
        type: file
      - description: Representative identity video (MP4/MOV, 1-20 seconds, <=50 MiB)
        in: formData
        name: verification_video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/general.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Submit employer information and automatically send verification OTP
      tags:
      - Legal employers
  /legal-employers/signup-options:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get legal employer signup choices
      tags:
      - Legal employers
  /legal-employers/verify-otp:
    post:
      consumes:
      - application/json
      description: Checks phone and code against the stored submission. Creates the
        shared employer and legal profile atomically and consumes the OTP. Does not
        require re-uploading files. Login is available after successful verification.
      parameters:
      - description: Phone and received OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/general.LegalEmployerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Verify legal employer and complete signup
      tags:
      - Legal employers
  /parents/invitations/validate:
    post:
      consumes:
      - application/json
      description: A parent cannot sign up without an unexpired code generated by
        a verified job seeker. Returns the saved parent identity and phone; these
        cannot be overridden in signup. Checking a code does not consume it.
      parameters:
      - description: Invitation code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.ParentCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.ParentInvitationInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Check a parent invitation before signup
      tags:
      - Parents
  /parents/otp:
    post:
      consumes:
      - application/json
      description: Requires a valid invitation and pending parent signup. Wait 60
        seconds between sends. Sends only to the saved parent phone.
      parameters:
      - description: Invitation code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.ParentCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/general.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Resend parent signup OTP
      tags:
      - Parents
  /parents/signup:
    post:
      consumes:
      - multipart/form-data
      description: Invitation required. Name and phone come from the job seeker's
        invitation. Relationship is father or mother. Requires consent, password (8-72
        bytes), identity image (PNG/JPEG up to 5 MiB) and consent video (MP4/MOV,
        1-20 seconds, up to 50 MiB). No parent account or link exists until OTP verification.
        Pending submission lasts 30 minutes; invitation remains subject to its seven-day
        expiry.
      parameters:
      - description: Invitation code
        in: formData
        name: code
        required: true
        type: string
      - description: Relationship
        enum:
        - father
        - mother
        in: formData
        name: relationship
        required: true
        type: string
      - description: Password (8-72 bytes)
        in: formData
        name: password
        required: true
        type: string
      - description: Parent accepts the rules and approves the child
        in: formData
        name: consent_accepted
        required: true
        type: boolean
      - description: First page of parent identity document (PNG/JPEG, <=5 MiB)
        in: formData
        name: identity_document
        required: true
        type: file
      - description: Parent consent video (MP4/MOV, 1-20 seconds, <=50 MiB)
        in: formData
        name: consent_video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/general.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Submit parent documents and send OTP to the saved phone
      tags:
      - Parents
  /parents/verify-otp:
    post:
      consumes:
      - application/json
      description: Submit the saved parent phone and received OTP. The pending signup
        must still have a valid invitation; its code is checked internally and is
        not submitted here. OTP expires in five minutes and permits five failed attempts.
        Parent creation, invitation consumption and the parent connection commit atomically.
      parameters:
      - description: Parent phone and SMS OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.ParentVerifyOTPRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/general.ParentSignupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Verify parent OTP, create parent, and link the job seeker
      tags:
      - Parents
produces:
- application/json
securityDefinitions:
  BearerAuth:
    description: 'Swagger authorizes automatically after login. Manual entry accepts
      access_token or Bearer followed by access_token. Other API clients must send
      Authorization: Bearer <access_token>.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
