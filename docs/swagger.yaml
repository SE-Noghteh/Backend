        in: formData
        name: birth_year
        required: true
        type: integer
      - default: 1
        description: Jalali month
        in: formData
        name: birth_month
        required: true
        type: integer
      - default: 1
        description: Jalali day
        in: formData
        name: birth_day
        required: true
        type: integer
      - description: Province from signup-options
        in: formData
        name: province
        required: true
        type: string
      - description: City belonging to selected province
        in: formData
        name: city
        required: true
        type: string
      - description: Full residence address
        in: formData
        name: address
        required: true
        type: string
      - description: Ten-digit postal code
        in: formData
        name: postal_code
        required: true
        type: string
      - description: Business or trade name
        in: formData
        name: business_name
        type: string
      - description: Business activity
        in: formData
        name: business_activity
        type: string
      - description: HTTP or HTTPS website/social page URL
        in: formData
        name: website
        type: string
      - default: false
        description: Has legal guardian
        in: formData
        name: has_legal_guardian
        type: boolean
      - description: Phone to receive verification OTP
        in: formData
        name: phone
        required: true
        type: string
      - description: Email address
        in: formData
        name: email
        type: string
      - description: Password (12-72 bytes)
        in: formData
        name: password
        required: true
        type: string
      - description: First page of identity document (PDF/PNG/JPEG, <=5 MiB)
        in: formData
        name: identity_document
        required: true
        type: file
      - description: Optional business license (PDF/PNG/JPEG, <=5 MiB)
        in: formData
        name: business_license
        type: file
      - description: Identity video (MP4/MOV, 1-20 seconds, <=50 MiB)
        in: formData
        name: verification_video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/general.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
