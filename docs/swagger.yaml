  general.AdminParentResponse:
    properties:
      admin_approval_status:
        $ref: '#/definitions/enums.AdminReviewStatus'
      admin_review_message:
        type: string
      admin_reviewed_at:
        type: string
      created_at:
        type: string
      first_name:
        example: علی
        type: string
      has_consent_video:
        type: boolean
      has_identity_document:
        type: boolean
      id:
        example: 1
        type: integer
      last_name:
        example: رضایی
        type: string
      phone:
        example: "09123456789"
        type: string
      relationship:
        type: string
