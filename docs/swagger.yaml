    x-enum-varnames:
    - InterestProgramming
    - InterestDesign
    - InterestMarketing
    - InterestAccounting
    - InterestSales
    - InterestContent
    - InterestTranslation
    - InterestTeaching
    - InterestEngineering
    - InterestSupport
  enums.LegalEntityType:
    enum:
    - limited_liability
    - private_joint_stock
    - public_joint_stock
    - cooperative
    - institution
    - organization
    type: string
    x-enum-varnames:
    - LegalLimitedLiability
    - LegalPrivateJointStock
    - LegalPublicJointStock
    - LegalCooperative
    - LegalInstitution
    - LegalOrganization
  enums.Province:
    enum:
    - تهران
    - اصفهان
    - خراسان رضوی
    - فارس
    - آذربایجان شرقی
    - البرز
    - قم
    - خوزستان
    - گیلان
    - یزد
    type: string
    x-enum-varnames:
    - ProvinceTehran
    - ProvinceIsfahan
    - ProvinceKhorasanRazavi
    - ProvinceFars
    - ProvinceEastAzerbaijan
    - ProvinceAlborz
    - ProvinceQom
    - ProvinceKhuzestan
    - ProvinceGilan
    - ProvinceYazd
  enums.RepresentativePosition:
    enum:
    - ceo
    - authorized_signatory
    - attorney
    type: string
    x-enum-varnames:
    - RepresentativeCEO
    - RepresentativeAuthorizedSignatory
    - RepresentativeAttorney
  general.AdminJobSeekerResponse:
    properties:
      address:
        type: string
      admin_approval_status:
        $ref: '#/definitions/enums.AdminReviewStatus'
      admin_approved:
        type: boolean
      admin_approved_parent:
        type: boolean
      admin_review_message:
        type: string
      admin_reviewed_at:
        type: string
      birth_date:
        type: string
      city:
        $ref: '#/definitions/enums.City'
      created_at:
        type: string
      first_name:
        example: علی
        type: string
      gender:
        $ref: '#/definitions/enums.Gender'
      has_verification_video:
        type: boolean
      id:
        example: 1
        type: integer
      interests:
        items:
          $ref: '#/definitions/enums.Interest'
        type: array
      last_name:
        example: رضایی
        type: string
      national_code:
        type: string
      parent_approval_required:
        type: boolean
      parent_connected:
        type: boolean
      parent_id:
        type: integer
      parent_relationship:
        type: string
      phone:
        example: "09123456789"
        type: string
      signup_status:
        enum:
        - pending
        - approved
