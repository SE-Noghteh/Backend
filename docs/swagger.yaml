    type: object
  general.IndividualEmployerLoginResponse:
    properties:
      access_token:
        type: string
      data:
        $ref: '#/definitions/general.IndividualEmployerIdentity'
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  general.IndividualEmployerResponse:
    properties:
      data:
        $ref: '#/definitions/general.IndividualEmployerIdentity'
    type: object
  general.JobSeekerIdentity:
    properties:
      admin_approval_status:
        $ref: '#/definitions/enums.AdminReviewStatus'
      admin_approved:
        type: boolean
      admin_approved_parent:
        type: boolean
      admin_review_message:
        type: string
      admin_reviewed_at:
        type: string
      created_at:
        type: string
      first_name:
        example: علی
        type: string
      id:
        example: 1
        type: integer
      last_name:
        example: رضایی
        type: string
      parent_approval_required:
        type: boolean
      parent_connected:
        type: boolean
      parent_id:
        type: integer
      parent_relationship:
        type: string
      phone:
        example: "09123456789"
        type: string
      signup_status:
        enum:
        - pending
        - approved
        example: pending
        type: string
    type: object
  general.JobSeekerParentRequest:
    properties:
      first_name:
        example: Ali
        type: string
      last_name:
        example: Ahmadi
        type: string
      phone:
        example: "09129876543"
        type: string
      skip:
        type: boolean
    type: object
  general.LegalEmployerIdentity:
    properties:
      activities:
        items:
          $ref: '#/definitions/enums.Interest'
        type: array
      address:
        type: string
      city:
        $ref: '#/definitions/enums.City'
      company_name:
        type: string
      company_national_id:
        type: string
      created_at:
        type: string
      economic_code:
        type: string
      email:
        type: string
      employer_type:
        $ref: '#/definitions/enums.EmployerType'
      has_tax_file:
        type: boolean
      id:
        type: integer
      legal_entity_type:
        $ref: '#/definitions/enums.LegalEntityType'
      phone:
        type: string
      postal_code:
        type: string
      province:
        $ref: '#/definitions/enums.Province'
      registration_number:
        type: string
      representative_first_name:
        type: string
      representative_gender:
        $ref: '#/definitions/enums.Gender'
      representative_last_name:
        type: string
      representative_national_code:
        type: string
      representative_position:
        $ref: '#/definitions/enums.RepresentativePosition'
      requires_activity_license:
        type: boolean
      review_status:
        $ref: '#/definitions/enums.EmployerReviewStatus'
      website:
        type: string
    type: object
  general.LegalEmployerLoginResponse:
    properties:
      access_token:
        type: string
      data:
        $ref: '#/definitions/general.LegalEmployerIdentity'
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  general.LegalEmployerResponse:
    properties:
      data:
        $ref: '#/definitions/general.LegalEmployerIdentity'
    type: object
  general.LoginRequest:
    properties:
      password:
        example: choose-a-private-password
        format: password
        type: string
      phone:
        example: "09123456789"
        type: string
    required:
    - password
    - phone
    type: object
  general.LoginResponse:
    properties:
      access_token:
        type: string
      data:
        $ref: '#/definitions/general.JobSeekerIdentity'
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  general.OTPResponse:
    properties:
      expires_in:
        example: 300
        type: integer
      message:
        example: OTP sent
        type: string
      resend_after:
        example: 60
        type: integer
    type: object
  general.ParentCodeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  general.ParentSignupResponse:
    properties:
      admin_approval_status:
        $ref: '#/definitions/enums.AdminReviewStatus'
      admin_review_message:
        type: string
      admin_reviewed_at:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      message:
        type: string
      phone:
        type: string
      relationship:
        type: string
    type: object
  general.ParentVerifyOTPRequest:
    properties:
      otp:
        example: "123456"
        type: string
      phone:
        example: "09129876543"
        type: string
    required:
    - otp
    - phone
    type: object
  general.PasswordResetResponse:
    properties:
      message:
        example: Password reset successfully. Please log in with your new password.
        type: string
    type: object
  general.PhoneChangeRequest:
    properties:
      new_phone:
        example: "09129876543"
        type: string
    required:
    - new_phone
    type: object
  general.RegisteredParentRequest:
    properties:
      phone:
        example: "09129876543"
        type: string
    required:
    - phone
    type: object
  general.ResendOTPRequest:
    properties:
      phone:
        example: "09123456789"
        type: string
    required:
    - phone
    type: object
  general.ResetJobSeekerPasswordRequest:
    properties:
      new_password:
        example: your-new-password
        type: string
      otp:
        example: "123456"
        type: string
      phone:
        example: "09123456789"
        type: string
    required:
    - new_password
    - otp
    - phone
    type: object
  general.SignupOptionsResponse:
    properties:
      cities:
        items:
          $ref: '#/definitions/enums.City'
        type: array
      genders:
        items:
          $ref: '#/definitions/enums.Gender'
        type: array
      interests:
        items:
          $ref: '#/definitions/enums.Interest'
        type: array
    type: object
  general.SignupResponse:
    properties:
      data:
        $ref: '#/definitions/general.JobSeekerIdentity'
    type: object
  general.VerifyOTPRequest:
    properties:
      otp:
        example: "123456"
        maxLength: 6
        minLength: 6
        type: string
      phone:
        example: "09123456789"
        type: string
    required:
