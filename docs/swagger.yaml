basePath: /v1
consumes:
- application/json
definitions:
  enums.AdminReviewStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - AdminReviewPending
    - AdminReviewApproved
    - AdminReviewRejected
  enums.City:
