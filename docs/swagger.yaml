  usecase.ParentApprovalResult:
    properties:
      admin_approved:
        type: boolean
      admin_approved_parent:
        type: boolean
      expires_at:
        type: string
      invitation_code:
        type: string
      parent_approval_required:
        type: boolean
      parent_connected:
        type: boolean
      parent_id:
        type: integer
      signup_status:
        enum:
        - pending
        - approved
        example: pending
        type: string
    type: object
  usecase.ParentInvitationInfo:
    properties:
      expires_at:
        type: string
      first_name:
        type: string
      job_seeker_first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
    type: object
info:
  contact: {}
  description: Submit signup information and password to automatically receive an
    SMS OTP, verify the code, then login to obtain a JWT. Birth dates use the Jalali
    calendar. Signup and OTP resend send real SMS messages.
  title: Zedlancer Backend API
  version: "1.0"
paths:
  /admin/job-seekers:
    get:
      description: Lists minors with a connected parent and adults aged 18 or above,
        including adults who have not used the optional parent stage. Defaults to
        pending overall acceptance, excluding rejected job seeker reviews but including
        approved minors awaiting parent admin approval. Minors are approved only when
        all three approval flags are true; adults need only admin_approved. Pending
        users can still log in.
      parameters:
      - default: pending
        description: Overall approval (rejected selects job seeker admin rejection)
        enum:
        - pending
        - approved
        - rejected
        - all
        in: query
        name: status
        type: string
      - default: 20
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Nonnegative offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminJobSeekersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List job seekers ready for admin review
      tags:
      - Admin
  /admin/job-seekers/{id}:
    get:
      parameters:
      - description: Job seeker ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminJobSeekerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a job seeker's profile for review
      tags:
      - Admin
  /admin/job-seekers/{id}/documents/video:
    get:
      description: Returns a private signed download URL valid for five minutes.
      parameters:
      - description: Job seeker ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.DocumentURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a job seeker's verification video
      tags:
      - Admin
  /admin/job-seekers/{id}/review:
    post:
      consumes:
      - application/json
      description: Minors require a connected parent before review and remain pending
        until that parent also receives admin approval. Adults aged 18 and above need
        only their own admin approval; the optional parent stage is not required.
        Submit approved=true or false; message is optional. The decision and message
        are visible in job seeker login and /me responses. Rejection without a message
        uses a default message.
      parameters:
      - description: Job seeker ID
        in: path
        name: id
        required: true
        type: integer
      - description: Approval decision and optional message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.AdminReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminJobSeekerReviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject a job seeker
      tags:
      - Admin
  /admin/login:
    post:
      consumes:
      - application/json
      description: No signup or OTP. Admin credentials are provisioned through SQL.
        Passwords must be bcrypt hashes in the database. Five failed login attempts
        per username within 15 minutes trigger a temporary lockout. Returns an admin-only
        JWT and automatically authorizes Swagger.
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/general.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      summary: Admin login with username and password
      tags:
      - Admin
  /admin/parents:
    get:
      description: Defaults to pending parent reviews. Rejected parents are returned
        only by status=rejected or status=all.
      parameters:
      - default: pending
        description: Review status
        enum:
        - pending
        - approved
        - rejected
        - all
        in: query
        name: status
        type: string
      - default: 20
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Nonnegative offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminParentsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List parents awaiting or having received admin review
      tags:
      - Admin
  /admin/parents/{id}:
    get:
      parameters:
      - description: Parent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.AdminParentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a parent profile for review
      tags:
      - Admin
  /admin/parents/{id}/documents/{kind}:
    get:
      description: Returns a private signed download URL valid for five minutes.
      parameters:
      - description: Parent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Document kind
        enum:
        - identity
        - consent-video
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/general.DocumentURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/general.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/general.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a parent's identity image or consent video
      tags:
      - Admin
  /admin/parents/{id}/review:
    post:
      consumes:
      - application/json
